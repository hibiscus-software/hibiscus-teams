# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.3
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.3]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.3.0.84
# The NeoForge versions the mod jar loads on: every 26.3 build from the first beta. Classes compiled against neo_version
# were run (game tests) on 26.3 builds across the range; the build workflow re-checks the floor. Re-test it before
# raising neo_version past an API change.
neo_version_range=[26.3.0.0-beta,)

## Mod Properties

# The unique mod identifier for the mod. Must match the String constant in the @Mod class.
mod_id=hibiscusteams
# The human-readable display name for the mod.
mod_name=Hibiscus Teams
# The license of the mod.
mod_license=MIT
# The mod version (https://semver.org/). The Minecraft version is appended automatically, e.g. 1.0.0+26.3.
mod_version=1.0.0
# The group ID for the mod, used when publishing to Maven. Matches the base package of the sources.
mod_group_id=software.hibiscus.hibiscusteams
# The GitHub repository, OWNER/NAME: the changelog links and release workflow point at it.
github_repository=hibiscus-software/hibiscus-teams

## Dependencies

# Hibiscus Lib, from GitHub Packages (see settings.gradle for building against a local checkout instead).
hibiscuslib_version=1.2.1+26.3
