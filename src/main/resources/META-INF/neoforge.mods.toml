license="${mod_license}"
issueTrackerURL="https://github.com/hibiscus-software/hibiscus-teams/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Hibiscus Software"
displayURL="https://github.com/hibiscus-software/hibiscus-teams"
# The mod list's square icon (left) and banner (right), at the jar root. Pixel art, so no blur when scaled.
iconFile="hibiscusteams_icon.png"
bannerFile="hibiscusteams_banner.png"
iconBlur=false
description='''
Player teams: parties with ranks, invites and allies, server teams, team chat and friendly fire, through a small GUI and a full command set. Implements the Hibiscus Lib Teams API.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# AFTER: Hibiscus Lib constructs first, so TeamsApi.install replaces the fallback it has already set.
[[dependencies.${mod_id}]]
    modId="hibiscuslib"
    type="required"
    versionRange="[1.4.1,)"
    ordering="AFTER"
    side="BOTH"
